spring:
  application:
    name: patient-service
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  sql:
    init:
      mode: always


server:
    port: 4000

#
## This tell spring that all warnings, info and errors should be logged to the console, and that the log level for the root logger is INFO. You can adjust the log levels for specific packages as needed.
#
logging:
  level:
    root: INFO
#    org.springframework: INFO
#    com.example.patientservice: DEBUG